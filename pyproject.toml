[project]
name = "agentlab-5-1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langchain-anthropic>=1.0,<2", "deepeval==4.2.8", "pydantic>=2.11,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not semantic' -p no:rerunfailures -p no:deepeval -p no:langsmith_plugin"
markers = ["semantic: live DeepEval judge calibration (requires explicit credentials)"]
